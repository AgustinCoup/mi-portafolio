<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distribución de mesas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6f0; --card:#ffffff; --ink:#2a2420; --muted:#7a6f66; --line:#e9e0d4;
    --accent:#b5543c; --accent-soft:#f6e3dc; --ok:#4f7a5a; --ok-soft:#e3eee5;
    --chip:#f3ece3; --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  header{padding:22px 18px 10px;max-width:1100px;margin:0 auto}
  h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:28px;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:14px}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
  .stat b{color:var(--ink);font-weight:600}
  .banner{max-width:1100px;margin:8px auto 0;padding:0 18px}
  .banner div{background:#fff7e0;border:1px solid #f0dfa8;color:#6b5414;border-radius:10px;padding:9px 12px;font-size:13px}
  main{max-width:1100px;margin:0 auto;padding:10px 18px 120px;display:grid;gap:14px;grid-template-columns:1fr}
  @media(min-width:760px){main{grid-template-columns:300px 1fr;align-items:start}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px}
  .panel h2{font-family:Fraunces,Georgia,serif;font-size:18px;font-weight:600;margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .count{font-family:Inter,sans-serif;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--chip);color:var(--muted);white-space:nowrap}
  .count.full{background:var(--ok-soft);color:var(--ok)}
  .count.over{background:var(--accent-soft);color:var(--accent)}
  #pool{position:sticky;top:10px}
  @media(max-width:759px){#pool{position:static}}
  .tables{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;min-height:44px;border-radius:12px;padding:4px;transition:background .15s}
  .chips.drop{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-2px}
  .chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer;user-select:none;touch-action:manipulation}
  .chip:hover{border-color:#d8c8b6}
  .chip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
  .empty{color:var(--muted);font-size:13px;padding:8px 6px}
  .seats{display:flex;gap:3px;margin-top:10px}
  .seat{flex:1;height:5px;border-radius:3px;background:var(--line)}
  .seat.on{background:var(--accent)}
  .tbl-head{display:flex;align-items:center;gap:6px}
  .iconbtn{border:none;background:transparent;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;font-size:15px;line-height:1}
  .iconbtn:hover{background:var(--chip);color:var(--ink)}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font:inherit;font-weight:500;cursor:pointer}
  .btn:hover{border-color:#d3c3b0}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{color:var(--accent);border-color:#ecc7bb}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .addrow{display:flex;gap:8px;margin-top:12px}
  input[type=text]{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;background:#fff;color:var(--ink)}
  input[type=text]:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .addtable{border:2px dashed var(--line);background:transparent;border-radius:16px;min-height:120px;color:var(--muted);font:inherit;font-weight:500;cursor:pointer}
  .addtable:hover{border-color:var(--accent);color:var(--accent)}
  .hint{font-size:12.5px;color:var(--muted);margin-top:10px}
  /* sheet */
  #scrim{position:fixed;inset:0;background:rgba(30,20,10,.35);display:none;z-index:20}
  #sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:min(520px,100%);background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.15);padding:18px 18px calc(18px + env(safe-area-inset-bottom));z-index:21;transition:transform .2s ease;max-height:85vh;overflow:auto}
  @media(min-width:760px){#sheet{bottom:auto;top:50%;transform:translate(-50%,-40%);opacity:0;pointer-events:none;border-radius:18px}}
  body.sheet-open #scrim{display:block}
  body.sheet-open #sheet{transform:translate(-50%,0)}
  @media(min-width:760px){body.sheet-open #sheet{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}}
  #sheet h3{font-family:Fraunces,Georgia,serif;margin:0 0 4px;font-size:21px}
  #sheet .sub{margin-bottom:12px}
  .opts{display:grid;gap:8px}
  .opt{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font:inherit;cursor:pointer;text-align:left;color:var(--ink)}
  .opt:hover:not(:disabled){border-color:var(--accent)}
  .opt.cur{background:var(--accent-soft);border-color:var(--accent)}
  .opt:disabled{opacity:.45;cursor:not-allowed}
  .opt small{color:var(--muted)}
  .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .row .btn{flex:1}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;z-index:30;pointer-events:none;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .ro .edit-only{display:none!important}
</style>
</head>
<body>
<header>
  <h1>Distribución de mesas</h1>
  <div class="sub">Tocá una persona para elegir su mesa (en compu también podés arrastrar). Los cambios se guardan solos y les aparecen a todos en pocos segundos.</div>
  <div class="stats">
    <span class="stat"><b id="s-total">–</b> invitados</span>
    <span class="stat"><b id="s-seated">–</b> ubicados</span>
    <span class="stat"><b id="s-free">–</b> sin mesa</span>
    <span class="stat"><b id="s-tables">–</b> mesas</span>
  </div>
</header>
<div class="banner" id="banner" hidden><div id="banner-text"></div></div>
<main>
  <section class="panel" id="pool">
    <h2>Sin asignar <span class="count" id="pool-count">0</span></h2>
    <div class="chips" id="pool-chips" data-mesa=""></div>
    <div class="addrow edit-only">
      <input type="text" id="new-guest" placeholder="Agregar invitado…" maxlength="40">
      <button class="btn primary" id="add-guest">Agregar</button>
    </div>
  </section>
  <section class="tables" id="tables"></section>
</main>

<div id="scrim"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast"></div>

<script>
const CAP = 10;
const API = 'https://jsonblob.com/api/jsonBlob';
const SEED = ["Mirko","Mati","Amado","Vicky","Lourdes","Isa","Zoe","Agustín","Vero","Dani","Ciro","Aurora","Jorge","Raquel","Daniela","Viviana","Garay","Mabel","Andrea","Gabi","Lucas","Dario","Oscar","Juli"];
let blobId = null, state = null, busy = false, selected = null;
const canWrite = true;

const $ = s => document.querySelector(s);
const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k === 'text') n.textContent = v;
    else n.setAttribute(k, v);
  }
  kids.flat().forEach(c => c != null && n.append(c));
  return n;
};
const collator = new Intl.Collator('es', {sensitivity: 'base'});
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400);
}
function banner(msg, ...extra) {
  $('#banner').hidden = !msg;
  $('#banner-text').replaceChildren(msg || '', ...extra);
}

/* ---------- data ---------- */
const tables = () => new Map((state?.mesas || []).map(t => [t.id, t]));
const guests = () => new Map((state?.invitados || []).map(g => [g.id, g]));
function sortedTables() { return [...(state?.mesas || [])]; }
function guestsAt(mesaId, s = state) {
  const tIds = new Set((s?.mesas || []).map(t => t.id));
  return (s?.invitados || []).filter(g => mesaId ? g.mesa === mesaId : !(g.mesa && tIds.has(g.mesa)))
    .sort((a, b) => collator.compare(a.nombre || '', b.nombre || ''));
}

async function load() {
  const r = await fetch(`${API}/${blobId}`, {headers: {Accept: 'application/json'}, cache: 'no-store'});
  if (r.status === 404) throw Object.assign(new Error('notfound'), {notfound: true});
  if (!r.ok) throw new Error('load ' + r.status);
  return r.json();
}
async function save(s) {
  const r = await fetch(`${API}/${blobId}`, {method: 'PUT', headers: {'Content-Type': 'application/json', Accept: 'application/json'}, body: JSON.stringify(s)});
  if (!r.ok) throw new Error('save ' + r.status);
}
// Lee lo último, aplica el cambio y guarda (evita pisar cambios de otros).
async function mutate(fn) {
  if (busy) { toast('Esperá un segundo…'); return false; }
  busy = true;
  try {
    const fresh = await load();
    const res = fn(fresh);
    if (res === false) { state = fresh; render(); return false; }
    await save(fresh);
    state = fresh; render();
    return true;
  } catch (e) {
    toast('No se pudo guardar. Revisá la conexión y probá de nuevo.');
    return false;
  } finally { busy = false; }
}
async function refresh() {
  if (busy || !blobId || document.hidden) return;
  try {
    const s = await load();
    if (busy) return;
    if (JSON.stringify(s) !== JSON.stringify(state)) { state = s; render(); }
    if ($('#banner-text').dataset.err) { banner(''); delete $('#banner-text').dataset.err; }
  } catch {
    banner('Sin conexión con los datos. Reintentando…'); $('#banner-text').dataset.err = '1';
  }
}

/* ---------- render ---------- */
function chip(g) {
  const c = el('button', {class: 'chip' + (selected === g.id ? ' sel' : ''), text: g.nombre || '(sin nombre)', draggable: 'true'});
  c.addEventListener('click', () => openGuest(g.id));
  c.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', g.id); e.dataTransfer.effectAllowed = 'move'; });
  return c;
}
function dropZone(zone, mesaId) {
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drop'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drop'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('drop');
    const id = e.dataTransfer.getData('text/plain'); if (id) moveGuest(id, mesaId);
  });
}
function render() {
  const pool = guestsAt(null);
  const pc = $('#pool-chips'); pc.replaceChildren();
  pool.length ? pool.forEach(g => pc.append(chip(g))) : pc.append(el('div', {class: 'empty', text: state ? '¡Todos tienen mesa! 🎉' : 'Cargando…'}));
  $('#pool-count').textContent = pool.length;

  const wrap = $('#tables'); wrap.replaceChildren();
  sortedTables().forEach((t, i) => {
    const people = guestsAt(t.id), n = people.length;
    const card = el('div', {class: 'panel'});
    const head = el('h2', {},
      el('span', {class: 'tbl-head'}, el('span', {text: t.nombre || `Mesa ${i + 1}`}),
        el('button', {class: 'iconbtn', title: 'Editar mesa', 'aria-label': 'Editar mesa', onclick: () => openTable(t.id)}, '✎')),
      el('span', {class: 'count' + (n === CAP ? ' full' : n > CAP ? ' over' : ''), text: `${n}/${CAP}`}));
    const seats = el('div', {class: 'seats'}, Array.from({length: CAP}, (_, k) => el('span', {class: 'seat' + (k < n ? ' on' : '')})));
    const cz = el('div', {class: 'chips'});
    people.length ? people.forEach(g => cz.append(chip(g))) : cz.append(el('div', {class: 'empty', text: 'Mesa vacía'}));
    dropZone(cz, t.id);
    card.append(head, seats, cz);
    wrap.append(card);
  });
  if (state) wrap.append(el('button', {class: 'addtable', onclick: addTable}, '+ Agregar mesa'));

  const total = state ? state.invitados.length : null, free = pool.length;
  $('#s-total').textContent = state ? total : '–';
  $('#s-seated').textContent = state ? total - free : '–';
  $('#s-free').textContent = state ? free : '–';
  $('#s-tables').textContent = state ? state.mesas.length : '–';
}

/* ---------- sheet ---------- */
function openSheet(...content) { $('#sheet').replaceChildren(...content.filter(Boolean)); document.body.classList.add('sheet-open'); }
function closeSheet() { document.body.classList.remove('sheet-open'); selected = null; render(); }
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function openGuest(id) {
  const g = guests().get(id); if (!g) return;
  selected = id; render();
  const tmap = tables();
  const cur = g.mesa && tmap.has(g.mesa) ? g.mesa : '';
  const opts = el('div', {class: 'opts'});
  sortedTables().forEach(t => {
    const n = guestsAt(t.id).length, here = cur === t.id;
    opts.append(el('button', {class: 'opt' + (here ? ' cur' : ''), ...(n >= CAP && !here ? {disabled: ''} : {}),
      onclick: () => { closeSheet(); moveGuest(id, t.id); }},
      el('span', {text: t.nombre}), el('small', {text: here ? 'Está acá' : n >= CAP ? 'Llena' : `${n}/${CAP}`})));
  });
  opts.append(el('button', {class: 'opt' + (cur === '' ? ' cur' : ''), onclick: () => { closeSheet(); moveGuest(id, null); }},
    el('span', {text: 'Sin asignar'}), el('small', {text: cur === '' ? 'Está acá' : ''})));
  openSheet(
    el('h3', {text: g.nombre}),
    el('div', {class: 'sub', text: '¿A qué mesa va?'}),
    opts,
    el('div', {class: 'row'},
      el('button', {class: 'btn', onclick: () => renameGuest(id)}, 'Cambiar nombre'),
      el('button', {class: 'btn danger', onclick: () => confirmDeleteGuest(id)}, 'Quitar invitado')));
}
function textSheet(title, value, placeholder, onSave, extra = []) {
  const inp = el('input', {type: 'text', value: value || '', maxlength: '40', placeholder: placeholder || ''});
  const go = () => { const v = inp.value.trim(); if (!v) return; closeSheet(); if (v !== value) onSave(v); };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  openSheet(el('h3', {text: title}), el('div', {class: 'addrow'}, inp),
    el('div', {class: 'row'}, el('button', {class: 'btn', onclick: closeSheet}, 'Cancelar'), el('button', {class: 'btn primary', onclick: go}, 'Guardar')),
    ...extra);
  setTimeout(() => inp.focus(), 50);
}
function renameGuest(id) {
  const g = guests().get(id);
  textSheet('Cambiar nombre', g.nombre, '', v => mutate(s => { const x = s.invitados.find(i => i.id === id); if (!x) return false; x.nombre = v; }));
}
function confirmDeleteGuest(id) {
  const g = guests().get(id);
  openSheet(el('h3', {text: `¿Quitar a ${g.nombre}?`}), el('div', {class: 'sub', text: 'Se borra de la lista de invitados para todos.'}),
    el('div', {class: 'row'}, el('button', {class: 'btn', onclick: closeSheet}, 'Cancelar'),
      el('button', {class: 'btn primary', onclick: async () => {
        closeSheet();
        if (await mutate(s => { s.invitados = s.invitados.filter(i => i.id !== id); })) toast(`${g.nombre} quitado`);
      }}, 'Quitar')));
}
function openTable(tid) {
  const t = tables().get(tid); if (!t) return;
  const n = guestsAt(tid).length;
  textSheet('Nombre de la mesa', t.nombre, 'Ej: Mesa familia',
    v => mutate(s => { const x = s.mesas.find(m => m.id === tid); if (!x) return false; x.nombre = v; }),
    [el('div', {class: 'row'}, el('button', {class: 'btn danger', onclick: () => confirmDeleteTable(tid)}, 'Eliminar mesa')),
     n ? el('div', {class: 'hint', text: `Si la eliminás, sus ${n} invitados vuelven a "Sin asignar".`}) : null]);
}
function confirmDeleteTable(tid) {
  const t = tables().get(tid);
  openSheet(el('h3', {text: `¿Eliminar ${t.nombre}?`}), el('div', {class: 'sub', text: 'Las personas sentadas ahí pasan a "Sin asignar".'}),
    el('div', {class: 'row'}, el('button', {class: 'btn', onclick: closeSheet}, 'Cancelar'),
      el('button', {class: 'btn primary', onclick: () => {
        closeSheet();
        mutate(s => { s.mesas = s.mesas.filter(m => m.id !== tid); s.invitados.forEach(g => { if (g.mesa === tid) g.mesa = null; }); });
      }}, 'Eliminar')));
}

/* ---------- acciones ---------- */
function moveGuest(id, mesaId) {
  const g = guests().get(id); if (!g) return;
  if ((g.mesa || null) === (mesaId || null)) return;
  if (mesaId && guestsAt(mesaId).length >= CAP) { toast(`${tables().get(mesaId).nombre} ya tiene ${CAP} personas`); return; }
  // cambio optimista en pantalla
  g.mesa = mesaId || null; render();
  mutate(s => {
    const x = s.invitados.find(i => i.id === id); if (!x) return false;
    if (mesaId && !s.mesas.some(m => m.id === mesaId)) return false;
    if (mesaId && guestsAt(mesaId, s).length >= CAP) { toast('Esa mesa se llenó recién'); return false; }
    x.mesa = mesaId || null;
  });
}
async function addGuest() {
  const inp = $('#new-guest'); const v = inp.value.trim(); if (!v || !state) return;
  if (state.invitados.some(g => collator.compare(g.nombre || '', v) === 0)) { toast(`${v} ya está en la lista`); return; }
  inp.value = '';
  if (await mutate(s => { s.invitados.push({id: uid('g'), nombre: v, mesa: null}); })) toast(`${v} agregado`);
}
function addTable() {
  mutate(s => { s.mesas.push({id: uid('m'), nombre: `Mesa ${s.mesas.length + 1}`}); });
}
$('#add-guest').addEventListener('click', addGuest);
$('#new-guest').addEventListener('keydown', e => { if (e.key === 'Enter') addGuest(); });

/* ---------- inicio ---------- */
function shareLink() {
  const url = location.href;
  const btn = el('button', {class: 'btn primary', style: 'margin-top:8px;padding:6px 12px', onclick: async () => {
    try { await navigator.clipboard.writeText(url); toast('Link copiado'); } catch { toast('Copiá el link de la barra de direcciones'); }
  }}, 'Copiar link');
  return btn;
}
async function createBoard() {
  const seed = {
    mesas: [1, 2, 3].map(n => ({id: 'm' + n, nombre: `Mesa ${n}`})),
    invitados: SEED.map((nombre, i) => ({id: 'g' + String(i + 1).padStart(2, '0'), nombre, mesa: null}))
  };
  const r = await fetch(API, {method: 'POST', headers: {'Content-Type': 'application/json', Accept: 'application/json'}, body: JSON.stringify(seed)});
  if (!r.ok) throw new Error('create ' + r.status);
  const loc = r.headers.get('x-jsonblob-id') || (r.headers.get('Location') || '').split('/').pop();
  if (!loc) throw new Error('noid');
  return {id: loc, data: seed};
}

dropZone($('#pool-chips'), null);
render();

(async () => {
  const fromHash = location.hash.replace(/^#/, '').trim();
  blobId = /^[A-Za-z0-9-]{6,}$/.test(fromHash) ? fromHash : null;
  try {
    if (!blobId) {
      const saved = (() => { try { return localStorage.getItem('mesas-blob'); } catch { return null; } })();
      if (saved) { blobId = saved; history.replaceState(null, '', '#' + blobId); }
    }
    if (blobId) {
      state = await load();
    } else {
      const c = await createBoard();
      blobId = c.id; state = c.data;
      history.replaceState(null, '', '#' + blobId);
      banner('¡Listo! Este es el link para compartir (incluye el código del final). ', shareLink());
    }
    try { localStorage.setItem('mesas-blob', blobId); } catch {}
    render();
    setInterval(refresh, 4000);
    document.addEventListener('visibilitychange', refresh);
  } catch (e) {
    banner(e.notfound ? 'No se encontró esta distribución. Revisá que el link esté completo.' : 'No se pudo conectar con los datos. Recargá la página en un rato.');
  }
})();
</script>
</body>
</html>
